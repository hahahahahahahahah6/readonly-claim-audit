[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "readonly-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented read-only claims against Python writes"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.scripts]
readonly-claim-audit = "readonly_claim_audit:main"

[tool.setuptools.packages.find]
where = ["src"]
